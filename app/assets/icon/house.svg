<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- Editable launcher master. Keep the house inside the central safe circle. -->
  <rect id="background" width="108" height="108" fill="#22634A" />
  <g fill="none" stroke="#FFF2D8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Level elevation: balanced gable, ridge cap and short dark roof edges. -->
    <path stroke-width="1.8" d="M 31 55 L 54 23 L 77 55 M 53 22.5 L 55 22.5 M 30.5 55 L 34 55 M 74 55 L 77.5 55 M 33 55 L 33 78 L 55.5 78 M 63 78 L 75 78 L 75 55" />
    <!-- Narrow attic window and three-part upper window. -->
    <path stroke-width="1.1" d="M 52.7 29.5 L 55.3 29.5 L 55.3 35.5 L 52.7 35.5 Z" />
    <path stroke-width="1.2" d="M 45 41 L 63 41 L 63 49.5 L 45 49.5 Z M 48.5 41 L 48.5 49.5 M 59.5 41 L 59.5 49.5 M 44.5 50 L 63.5 50" />
    <!-- Bay projects on the LEFT; its panes are not aligned with the upper ones. -->
    <path stroke-width="1.2" d="M 32.5 58 L 55.5 58 L 55.5 59.5 L 32.5 59.5 Z M 34.5 59.5 L 34.5 71.5 L 55 71.5 L 55 59.5 M 39 59.5 L 39 71.5 M 50.5 59.5 L 50.5 71.5 M 34 72 L 55.5 72" />
    <!-- Lower entrance canopy, door, narrow sidelights and raised threshold. -->
    <path stroke-width="1.1" d="M 63 59 L 75 59 M 63 60 L 75 60 M 63.5 73 L 63.5 61 L 73 61 L 73 73 M 65 61 L 65 77.5 L 71.5 77.5 L 71.5 61 M 67.5 63 L 67.5 74.5 M 69 63 L 69 74.5 M 64 78 L 73 78" />
    <!-- The only plant: narrow upright hedge immediately beside the entrance.
         A closed, lightly scalloped silhouette stays distinct in monochrome. -->
    <path stroke-width="1.25" d="M 58.7 54 Q 60.8 53.5 60.7 57 Q 62.3 58 61.6 61 Q 63 63 62 65 Q 63.4 67 62.2 69 Q 63.4 71 62.4 73 Q 63.3 76 61.7 79 Q 59.5 80 56.5 79 Q 55.1 77 56.1 74 Q 54.9 72 56 69 Q 55 66 56.1 64 Q 55.3 61 56.8 59 Q 56.2 56 58.7 54 Z" />
  </g>
</svg>
